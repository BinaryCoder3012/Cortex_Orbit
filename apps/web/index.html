<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CortexOrbit: a living star plate of everything you learn, catalogued and kept from fading." />
    <link rel="icon" type="image/svg+xml" href="/plate.svg" />
    <title>CortexOrbit</title>
    <script>
      try {
        const p = localStorage.getItem('cortex.print');
        document.documentElement.dataset.print = p || 'positive';
      } catch {
        document.documentElement.dataset.print = 'positive';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
